# Cloudflare Tunnel continues to forward these hosts to the existing Nginx.
server {
 listen 80;
 listen [::]:80;
 server_name th.io.vn;
 root /opt/th-portfolio/current/dist/web;
 index index.html;
 set_real_ip_from 127.0.0.1;
 set_real_ip_from ::1;
 real_ip_header CF-Connecting-IP;
 real_ip_recursive off;
 client_max_body_size 97m;
 client_body_timeout 180s;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache" always; }
 location = /build-info.json { add_header Cache-Control "no-store" always; }
 location /api/ {
  access_log off;
  proxy_pass http://127.0.0.1:3001;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  # Do not trust forwarded client addresses supplied by arbitrary callers.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_request_buffering off;
 }
}
