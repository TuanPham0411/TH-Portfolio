name: Diagnose storage startup
on:
  push:
    paths: ['.github/workflows/storage-startup-check.yml']
permissions: {contents: read}
jobs:
  status:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Check server storage and runner availability
        run: |
          docker ps -a --format '{{.Names}} {{.Status}}'
          timeout 20 docker logs --tail=12 th-platform-storage-1
          systemctl list-units --type=service --all 'actions.runner.*' --no-pager
