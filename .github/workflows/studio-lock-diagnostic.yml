name: Read-only Studio deployment diagnosis
on:
  push:
    branches: [ops/studio-lock-diagnostic]
    paths: [.github/workflows/studio-lock-diagnostic.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Inspect lock ownership and immutable image state without reading secrets
        env:
          SELECTED_RUNNER: '${{ runner.name }}'
        run: |
          test "$SELECTED_RUNNER" = th-portfolio
          python3 - <<'PY'
          import pathlib,os,json,subprocess
          home=pathlib.Path.home();lock=home/'th-platform/deploy.lock';holders=[]
          inode=str(lock.stat().st_ino)
          for line in pathlib.Path('/proc/locks').read_text().splitlines():
           parts=line.split()
           if 'FLOCK' not in parts or not any(p.endswith(':'+inode) for p in parts):continue
           index=parts.index('FLOCK');pid=parts[index+3]
           try:
            args=pathlib.Path('/proc/'+pid+'/cmdline').read_bytes().split(b'\0')
            known=next((pathlib.Path(a.decode()).name for a in args if a.endswith((b'/application.py',b'/snapshot.py',b'/recovery-drill.py'))),'other')
            holders.append({'pid':int(pid),'script':known,'waiting':'->' in parts})
           except (OSError,ValueError):pass
          state=json.loads((home/'th-platform/state/ai-agent-deployment.json').read_text())
          ids=subprocess.run(['docker','ps','-aq'],capture_output=True,text=True,check=True,timeout=20).stdout.split()
          containers=[]
          if ids:
           data=json.loads(subprocess.run(['docker','inspect',*ids],capture_output=True,text=True,check=True,timeout=30).stdout)
           for item in data:
            name=item['Name'].lstrip('/')
            if name.startswith('ai-agent-') or 'migrate-run' in name:
             env=dict(x.split('=',1) for x in item['Config'].get('Env',[]) if '=' in x)
             containers.append({'name':name,'state':item['State']['Status'],'image':item['Config']['Image'],'scratchRecovery':'/th_recovery_' in env.get('DATABASE_URL','')})
          print(json.dumps({'lockOwners':holders,'recordedImageTag':state['imageTag'],'containers':containers}))
          PY
